name: Documentation

on:
  push:
    branches:
      - main
permissions:
    contents: read
    pages: write
    id-token: write
jobs:

  discover:
    runs-on: ubuntu-latest

    outputs:
      packages: ${{ steps.packages.outputs.packages }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Discover packages
        id: packages
        shell: bash
        run: |
          packages=$(find packages -mindepth 1 -maxdepth 1 -type d -printf '"%p",')
          echo "packages=[$packages]" >> "$GITHUB_OUTPUT"

  docs:
    needs: discover
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        working-directory: ${{ matrix.package }}
        run: pnpm docs
